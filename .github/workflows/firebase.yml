name: firebase
# Tests the server (rules + Cloud Functions) on Firebase's local emulators, then deploys them to the real project.
# Test/deploy logs are committed to the ci-logs branch so they can be read without GitHub's log viewer.
on:
  push:
    branches: [main]
    paths: ["functions/**", "tools/**", "ci/**", "admin/**", "firebase.json", ".github/workflows/firebase.yml", "test/index.html"]
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: firebase, cancel-in-progress: false }
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Install
        run: |
          (cd functions && npm install --no-audit --no-fund)
          (cd ci && npm install --no-audit --no-fund && npx playwright install --with-deps chromium)
      - name: Unit + emulator tests
        id: tests
        run: |
          set -o pipefail
          mkdir -p ci-out
          cp functions/admins.json /tmp/admins.real.json
          {
            echo "== version.json matches the game"; node tools/stamp-version.js --check &&
            echo "== unit tests"; node functions/test/core.test.js &&
            echo '["ciadmin0001"]' > functions/admins.json && CI_ADMIN_ANY_PROVIDER=1 node tools/build-rules.js &&
            echo "== emulator tests" &&
            npx -y firebase-tools@13 emulators:exec --project demo-kingdom --only auth,firestore,functions "node ci/integration.test.js && echo == end-to-end game test && node ci/e2e.test.js"
          } 2>&1 | tee ci-out/test.log
      - name: Failures as annotations (readable through the API when the log isn't)
        if: always()
        run: |
          grep -nE "FAIL|not ok|AssertionError|Error:|CRASH|rc=|failed" ci-out/test.log | grep -v "PERMISSION_DENIED" | head -40 | sed 's/\x1b\[[0-9;]*m//g' | while IFS= read -r l; do echo "::error::${l:0:900}"; done || true
          tail -5 ci-out/test.log | sed 's/\x1b\[[0-9;]*m//g' | while IFS= read -r l; do echo "::warning::tail ${l:0:900}"; done || true
      - name: Restore real admin list
        if: always()
        run: cp /tmp/admins.real.json functions/admins.json && node tools/build-rules.js
      - name: Publish test log
        if: always()
        run: |
          git config user.name "ci"; git config user.email "ci@users.noreply.github.com"
          git fetch origin ci-logs:ci-logs 2>/dev/null && git worktree add /tmp/cl ci-logs || { git worktree add --detach /tmp/cl && cd /tmp/cl && git checkout --orphan ci-logs && git rm -rfq . ; cd -; }
          cp ci-out/test.log /tmp/cl/test.log
          echo "run ${GITHUB_RUN_ID} sha ${GITHUB_SHA} tests=${{ steps.tests.outcome }}" > /tmp/cl/test-status.txt
          cd /tmp/cl && git add -A && git commit -qm "test log ${GITHUB_RUN_ID}" && git push -q origin ci-logs
  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Deploy rules + functions
        id: deploy
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -o pipefail
          mkdir -p ci-out
          if [ -z "$SA" ]; then echo "No FIREBASE_SERVICE_ACCOUNT secret yet - skipping deploy." | tee ci-out/deploy.log; exit 0; fi
          echo "$SA" > /tmp/sa.json
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa.json
          (cd functions && npm install --no-audit --no-fund)
          node tools/build-rules.js
          npx -y firebase-tools@13 deploy --only firestore:rules,functions --project kingdom-strategy --non-interactive --force 2>&1 | tee ci-out/deploy.log
      - name: Let the game call the functions (Cloud Run invoker = allUsers)
        id: invoker
        if: steps.deploy.outcome == 'success'
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -o pipefail
          echo "$SA" > /tmp/sa.json
          gcloud auth activate-service-account --key-file=/tmp/sa.json --quiet 2>&1 | tee -a ci-out/deploy.log
          for f in $(grep -oE '^exports\.[A-Za-z0-9_]+' functions/index.js | sed 's/exports\.//' | grep -v '^on[A-Z]' | tr 'A-Z' 'a-z'); do  # on* = save triggers: never public
            gcloud run services add-iam-policy-binding $f --project kingdom-strategy --region us-central1 --member=allUsers --role=roles/run.invoker --quiet >/dev/null 2>/tmp/err.txt && echo "invoker ok: $f" | tee -a ci-out/deploy.log || { echo "invoker FAILED: $f"; cat /tmp/err.txt; } 2>&1 | tee -a ci-out/deploy.log
          done
      - name: Smoke test (functions reachable by the game, refuse signed-out calls)
        if: steps.deploy.outcome == 'success'
        run: |
          set -o pipefail
          for f in claimLevel hitBase extinguishBase touch adminDeliverPurchase; do
            out=$(curl -s -m 30 -X POST -H "content-type: application/json" -d '{"data":{"env":"test"}}' https://us-central1-kingdom-strategy.cloudfunctions.net/$f)
            echo "$f -> $out" | tee -a ci-out/deploy.log
            echo "$out" | grep -q UNAUTHENTICATED || { echo "SMOKE FAIL: $f not reachable as expected" | tee -a ci-out/deploy.log; exit 1; }
          done
          echo "SMOKE OK" | tee -a ci-out/deploy.log
      - name: Publish deploy log
        if: always()
        run: |
          git config user.name "ci"; git config user.email "ci@users.noreply.github.com"
          git fetch origin ci-logs:ci-logs 2>/dev/null && git worktree add /tmp/cl ci-logs || { git worktree add --detach /tmp/cl && cd /tmp/cl && git checkout --orphan ci-logs && git rm -rfq . ; cd -; }
          cp ci-out/deploy.log /tmp/cl/deploy.log 2>/dev/null || echo "no deploy log" > /tmp/cl/deploy.log
          echo "run ${GITHUB_RUN_ID} sha ${GITHUB_SHA} deploy=${{ steps.deploy.outcome }}" > /tmp/cl/deploy-status.txt
          cd /tmp/cl && git add -A && git commit -qm "deploy log ${GITHUB_RUN_ID}" && git push -q origin ci-logs
