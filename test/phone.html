<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kingdom Strategy (phone view)</title>
<style>
html,body{margin:0;height:100%;background:#05080f radial-gradient(ellipse at 50% 40%,#13213d 0%,#05080f 70%);overflow:hidden;font-family:sans-serif}
#pf{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:430px;height:min(932px,100vh);border:0;border-radius:18px;box-shadow:0 0 0 2px #2a4f86,0 0 40px #1f6fd055;background:#000}
#pcv{position:fixed;right:16px;top:16px;padding:8px 14px;border-radius:8px;border:1.5px solid #1f6c80;background:#57cfdf;color:#0e3440;font-weight:800;cursor:pointer}
#pnote{position:fixed;left:16px;top:18px;color:#8fa6c4;font-size:13px}
</style></head>
<body>
<!-- v1287 (Harley: phone view on PC). The game itself runs in the frame below at 430 px wide = the exact phone layout. -->
<div id="pnote">📱 Phone view (430 wide) - PC only, this browser only</div>
<button id="pcv" type="button">Back to PC view</button>
<iframe id="pf" allow="autoplay; clipboard-write"></iframe>
<script>
try { localStorage.setItem("kingdom_phone_view_v1", "1"); } catch (e) {}
document.getElementById("pf").src = "./?phoneframe=1" + location.hash;
document.getElementById("pcv").onclick = function () { try { localStorage.setItem("kingdom_phone_view_v1", "0"); } catch (e) {} location.href = "./"; };
</script>
</body></html>
