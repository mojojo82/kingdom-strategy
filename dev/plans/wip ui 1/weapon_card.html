*{box-sizing:border-box}

.ic svg{width:23px;height:23px}

.ab{position:absolute;left:30px;right:30px;top:458px}
.ab h2{margin:0 0 6px;font-size:26px;color:#f0c95f;letter-spacing:.4px;font-weight:700;text-shadow:0 0 10px #f0c95f44}
