<!doctype html><html><body style="margin:0;background:#2a3a4a"><canvas id=c width=1280 height=720></canvas><script>
const IM={}; /* filled by dev/bosses/serpent_preview_render.js from art/originals/bosses/clockwork_dragon/parts */ const I={}; let left=0; for (const k in IM){ left++; const im=new Image(); im.onload=()=>{left--;}; im.src=IM[k]; I[k]=im; }
const c=document.getElementById('c'), x=c.getContext('2d');
// spine: list of segments from head (index 0) to tail
const SEG=[['head'],['ring_gear'],['ring_plain'],['ring_stack'],['ring_plain'],['ring_gear'],['ring_plain'],['ring_stack'],['tail1'],['tail2'],['tail3'],['tailtip']];
const LEN={head:330, ring_plain:235, ring_gear:235, ring_stack:235, tail1:180, tail2:140, tail3:112, tailtip:250};
const S=0.40; // overall scale
function spineY(s,t){ // s = distance along body from head (px, unscaled)
  const amp = 150*Math.min(1, s/450);
  const lift = -380*Math.max(0, 1 - s/700)*Math.max(0, 1 - s/700);   // head and neck raised
  return amp*Math.sin(s*0.0030 - t*2.2) + lift + 30*Math.sin(t*1.3)*Math.max(0,1-s/600); }
const smoke=[]; let lastPuff=0;
function draw(t){
  x.clearRect(0,0,1280,720); x.fillStyle='#2a3a4a'; x.fillRect(0,0,1280,720);
  x.fillStyle='rgba(0,0,0,.25)'; x.beginPath(); x.ellipse(640,640,500,28,0,0,7); x.fill();
  // place segments along curve by arc length
  const pts=[]; let sAcc=0; const ox=170, oy=500;
  for (let i=0;i<SEG.length;i++){ const k=SEG[i][0]; const L=LEN[k]; const s0=sAcc, s1=sAcc+L; 
    const p0={x:ox+s0*S, y:oy+spineY(s0,t)*S}, p1={x:ox+s1*S, y:oy+spineY(s1,t)*S};
    pts.push({k, p0, p1, a:Math.atan2(p1.y-p0.y, p1.x-p0.x), L}); sAcc=s1-(i===0?70:48); }
  // breath cycle: every 5 s, jaw opens 2.0-3.2 s
  const ph=(t%5), open = ph>2 && ph<3.4 ? Math.sin(Math.min(1,(ph-2)/0.25)*Math.PI/2)*(ph>3.1? Math.max(0,(3.4-ph)/0.3):1) : 0;
  // draw tail -> head
  for (let i=pts.length-1;i>=0;i--){ const P=pts[i], im=I[P.k]; const cx=(P.p0.x+P.p1.x)/2, cy=(P.p0.y+P.p1.y)/2;
    x.save(); x.translate(cx,cy); x.rotate(P.a);
    if (P.k==='head'){ // head: neck stub at its right end (local 540,270) sits at p1
      x.restore(); x.save(); x.translate(P.p1.x,P.p1.y); x.rotate(P.a*0.6 - 0.05 - open*0.12); x.scale(S,S);
      // jaw first (behind head), hinge at jaw (232,32) -> head local (300,292)
      x.save(); x.translate(300-575, 292-270); x.rotate(open*0.7); x.drawImage(I.jaw,-232,-32); x.restore();
      x.drawImage(im,-575,-270);
      if (open>0.3 && t-lastPuff>0.04){ lastPuff=t; const m=x.getTransform(); const pt=m.transformPoint(new DOMPoint(70-575,330-270)); smoke.push({x:pt.x,y:pt.y,vx:-260-Math.random()*80,vy:(Math.random()-.5)*60,r:10,life:0}); }
    } else if (P.k==='tailtip'){ x.restore(); x.save(); x.translate(P.p0.x,P.p0.y); x.rotate(P.a); x.scale(-S,S); x.drawImage(im,-im.width+25,-im.height/2-10);
    } else { x.scale(S,S); const off = P.k==='ring_stack' ? -im.height/2-26 : -im.height/2; x.drawImage(im,-im.width/2,off);
      if (P.k==='ring_gear'){ x.save(); x.translate(-im.width/2+162,-im.height/2+218); x.rotate(t*2.2); const gs=0.7; x.drawImage(I.gear,-I.gear.width/2*gs,-I.gear.height/2*gs,I.gear.width*gs,I.gear.height*gs); x.restore(); }
      if (P.k==='ring_stack' && Math.random()<0.25){ const m=x.getTransform(); const pt=m.transformPoint(new DOMPoint(-im.width/2+128,off+10)); smoke.push({x:pt.x,y:pt.y,vx:(Math.random()-.5)*20,vy:-60,r:5,life:0,small:1}); }
    }
    x.restore(); }
  // smoke
  for (const s of smoke){ s.life+=1/30; s.x+=s.vx/30; s.y+=s.vy/30; s.r+= s.small?0.5:2.2; s.vx*=0.97; }
  while (smoke.length && smoke[0].life>1.4) smoke.shift();
  for (const s of smoke){ const a=Math.max(0,(s.small?0.5:0.7)*(1-s.life/1.4)); x.fillStyle='rgba(235,240,245,'+a+')'; x.beginPath(); x.arc(s.x,s.y,s.r,0,7); x.fill(); }
}
window.frame=(t)=>{ draw(t); return c.toDataURL('image/jpeg',0.9); }; window.ready=()=>left===0;
</script></body></html>
