<title>Model Bay</title>
<style>
/* Layout: one stage (the model, on a checkerboard so transparency shows) with a control dock under it; dock wraps on phones. */
:root {
  --bg: #efe9dd; --panel: #fbf7ef; --ink: #2a2117; --muted: #7a6a52; --line: #d9ccb4;
  --accent: #1f8a9c; --accent-ink: #ffffff; --gold: #b8892b; --chk-a: #e4dccd; --chk-b: #f4efe5;
  --display: "Cinzel", Georgia, serif; --body: "Nunito Sans", system-ui, sans-serif; --mono: "JetBrains Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #14100b; --panel: #221a12; --ink: #f3e8cf; --muted: #a3906a; --line: #4a3b24;
  --accent: #57cfdf; --accent-ink: #0e3440; --gold: #f0c95f; --chk-a: #2a2117; --chk-b: #1c150f; color-scheme: dark } }
:root[data-theme="dark"] { --bg: #14100b; --panel: #221a12; --ink: #f3e8cf; --muted: #a3906a; --line: #4a3b24;
  --accent: #57cfdf; --accent-ink: #0e3440; --gold: #f0c95f; --chk-a: #2a2117; --chk-b: #1c150f; color-scheme: dark }
body { background: var(--bg); color: var(--ink); font-family: var(--body); }
.wrap { padding: 14px 16px 24px; max-width: 900px; margin: 0 auto; display: grid; gap: 12px; }
header { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
h1 { font-family: var(--display); font-size: 22px; margin: 0; letter-spacing: .04em; color: var(--gold); text-wrap: balance; }
.meta { font-family: var(--mono); font-size: 11.5px; color: var(--muted); min-width: 0; overflow-wrap: anywhere; }
.stage { position: relative; aspect-ratio: 4 / 3; max-width: 100%; border: 1.5px solid var(--line); border-radius: 14px; overflow: hidden;
  background-color: var(--chk-b); background-image: linear-gradient(45deg, var(--chk-a) 25%, transparent 25%, transparent 75%, var(--chk-a) 75%), linear-gradient(45deg, var(--chk-a) 25%, transparent 25%, transparent 75%, var(--chk-a) 75%);
  background-size: 22px 22px; background-position: 0 0, 11px 11px; touch-action: none; }
.stage canvas { display: block; width: 100%; height: 100%; }
.drop { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; font-weight: 800; color: var(--accent-ink); background: color-mix(in srgb, var(--accent) 70%, transparent); }
.stage.over .drop { display: flex; }
.hint { position: absolute; left: 10px; bottom: 8px; font-size: 11px; color: var(--muted); background: color-mix(in srgb, var(--panel) 80%, transparent); padding: 2px 8px; border-radius: 8px; }
.dock { display: grid; gap: 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 12px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.lab { font-size: 11px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); width: 100%; }
button, .filebtn { font: 700 14px var(--body); padding: 9px 14px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--bg); color: var(--ink); cursor: pointer; }
button:focus-visible, .filebtn:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
button.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.filebtn input { position: absolute; width: 1px; height: 1px; opacity: 0; }
.filebtn { position: relative; }
label.tog { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink); }
.status { font-size: 12.5px; color: var(--muted); min-height: 1.2em; }
.shot { display: none; gap: 8px; }
.shot.show { display: grid; }
.shot img { max-width: 100%; border-radius: 10px; border: 1px solid var(--line); background-color: var(--chk-b); background-image: linear-gradient(45deg, var(--chk-a) 25%, transparent 25%, transparent 75%, var(--chk-a) 75%), linear-gradient(45deg, var(--chk-a) 25%, transparent 25%, transparent 75%, var(--chk-a) 75%); background-size: 16px 16px; background-position: 0 0, 8px 8px; }
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Nunito+Sans:wght@400;700;800&family=JetBrains+Mono&display=swap">
<div class="wrap">
  <header><h1>Model Bay</h1><div class="meta" id="meta">Loading…</div></header>
  <div class="stage" id="stage"><canvas id="cv"></canvas><div class="drop">Drop the .glb here</div><div class="hint">Drag to orbit · pinch or scroll to zoom</div></div>
  <div class="dock">
    <div class="row"><span class="lab">Camera</span>
      <button id="vFront" class="on">Front</button><button id="vLeft">Left</button><button id="vIso">Isometric 35°</button>
      <button id="vSpin" title="Turn the model 90° if its front points the wrong way">Turn model 90°</button>
    </div>
    <div class="row"><span class="lab">Model</span>
      <label class="filebtn">Open .glb<input type="file" id="file" accept=".glb,.gltf,model/gltf-binary"></label>
      <button id="vShip">Voidspire (built-in)</button>
      <label class="tog"><input type="checkbox" id="auto"> Spin slowly</label>
    </div>
    <div class="row"><span class="lab">Export</span>
      <button class="primary" id="png">Download PNG (transparent)</button>
      <label class="tog"><input type="checkbox" id="hi" checked> 2× size</label>
    </div>
    <div class="status" id="status"></div>
    <div class="shot" id="shot"><img id="shotImg" alt="Exported view"><div class="status">Downloads are off in this view - press and hold the picture to save it.</div></div>
  </div>
</div>

const cv = document.getElementById("cv"), stage = document.getElementById("stage"), meta = document.getElementById("meta"), status = document.getElementById("status");

renderer.setClearColor(0x000000, 0); renderer.outputColorSpace = THREE.SRGBColorSpace; renderer.toneMapping = THREE.ACESFilmicToneMapping;
const scene = new THREE.Scene();
const cam = new THREE.PerspectiveCamera(30, 4 / 3, 0.01, 1000);
scene.add(new THREE.HemisphereLight(0xfff4e0, 0x3a2f20, 1.6));
const sun = new THREE.DirectionalLight(0xffffff, 2.2); sun.position.set(-3, 5, 4); scene.add(sun);
const rim = new THREE.DirectionalLight(0x9fd8ff, 0.8); rim.position.set(4, 2, -5); scene.add(rim);

function setModel(obj, name) {

document.getElementById("vIso").onclick = () => goView("iso");
document.getElementById("vSpin").onclick = () => { spin = (spin + 1) % 4; holder.rotation.y = spin * Math.PI / 2; status.textContent = "Model turned " + spin * 90 + "°."; };
document.getElementById("vShip").onclick = () => { setModel(builtinShip(), "Voidspire Dreadnought"); status.textContent = ""; };
const auto = document.getElementById("auto");
document.getElementById("png").onclick = async () => {
  const scale = document.getElementById("hi").checked ? 2 : 1, w = stage.clientWidth * scale, h = stage.clientHeight * scale, pr = renderer.getPixelRatio();
  renderer.setPixelRatio(1); renderer.setSize(w, h, false); renderer.render(scene, cam);
  const blob = await new Promise((r) => cv.toBlob(r, "image/png"));
  renderer.setPixelRatio(pr); resize();
  const name = (meta.textContent.split(" · ")[0] || "model").replace(/\.(glb|gltf)$/i, "").replace(/[^\w-]+/g, "_") + "_" + view + ".png";
  let dl = null; try { dl = window.claude && (await window.claude.use("downloads")); } catch (e) {}
  if (dl) { try { await dl.save({ filename: name, data: blob }); status.textContent = "Saved " + name + " (" + w + "×" + h + ")."; return; } catch (e) { if (e && e.code === "declined") { status.textContent = "Download cancelled."; return; } } }
  const img = document.getElementById("shotImg"); img.src = URL.createObjectURL(blob); document.getElementById("shot").classList.add("show"); status.textContent = name + " (" + w + "×" + h + ")";
};
renderer.setAnimationLoop(() => { if (auto.checked && model) holder.rotation.y += 0.006; ctl.update(); renderer.render(scene, cam); });
resize(); setModel(builtinShip(), "Voidspire Dreadnought");
</script>
