<title>Neptune Filter</title>
<style>
/* Layout: the picture first (before/after), sliders under it in a wrapping dock; one column on phones. */
:root {
  --bg: #efe9dd; --panel: #fbf7ef; --ink: #2a2117; --muted: #7a6a52; --line: #d9ccb4;
  --accent: #1f8a9c; --accent-ink: #ffffff; --gold: #9a6f17; --chk-a: #e4dccd; --chk-b: #f4efe5;
  --display: "Cinzel", Georgia, serif; --body: "Nunito Sans", system-ui, sans-serif; --mono: "JetBrains Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #14100b; --panel: #221a12; --ink: #f3e8cf; --muted: #a3906a; --line: #4a3b24;
  --accent: #57cfdf; --accent-ink: #0e3440; --gold: #f0c95f; --chk-a: #2a2117; --chk-b: #1c150f; color-scheme: dark } }
:root[data-theme="dark"] { --bg: #14100b; --panel: #221a12; --ink: #f3e8cf; --muted: #a3906a; --line: #4a3b24;
  --accent: #57cfdf; --accent-ink: #0e3440; --gold: #f0c95f; --chk-a: #2a2117; --chk-b: #1c150f; color-scheme: dark }
body { background: var(--bg); color: var(--ink); font-family: var(--body); }
.wrap { padding: 14px 16px 24px; max-width: 980px; margin: 0 auto; display: grid; gap: 12px; }
header { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
h1 { font-family: var(--display); font-size: 22px; margin: 0; letter-spacing: .04em; color: var(--gold); }
.meta { font-family: var(--mono); font-size: 11.5px; color: var(--muted); min-width: 0; overflow-wrap: anywhere; }
.stage { position: relative; border: 1.5px solid var(--line); border-radius: 14px; overflow: hidden; min-height: 220px; display: flex; align-items: center; justify-content: center;
  background-color: var(--chk-b); background-image: linear-gradient(45deg, var(--chk-a) 25%, transparent 25%, transparent 75%, var(--chk-a) 75%), linear-gradient(45deg, var(--chk-a) 25%, transparent 25%, transparent 75%, var(--chk-a) 75%);
  background-size: 22px 22px; background-position: 0 0, 11px 11px; }
.stage canvas { display: block; max-width: 100%; max-height: 70vh; height: auto; }
.badge { position: absolute; left: 10px; top: 10px; font: 800 11px var(--body); letter-spacing: .1em; text-transform: uppercase; padding: 3px 9px; border-radius: 8px; background: var(--accent); color: var(--accent-ink); }
.stage.over::after { content: "Drop the image here"; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-weight: 800; color: var(--accent-ink); background: color-mix(in srgb, var(--accent) 70%, transparent); }
.dock { display: grid; gap: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 12px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.sliders { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 8px 18px; }
.sl { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; align-items: center; min-width: 0; }
.sl label { font-size: 13px; font-weight: 700; }
.sl output { font-family: var(--mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.sl input { grid-column: 1 / -1; width: 100%; accent-color: var(--accent); }
.lab { font-size: 11px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); width: 100%; }
button, .filebtn { font: 700 14px var(--body); padding: 9px 14px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--bg); color: var(--ink); cursor: pointer; position: relative; }
button:focus-visible, .filebtn:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
button.on, button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.filebtn input { position: absolute; width: 1px; height: 1px; opacity: 0; }
.status { font-size: 12.5px; color: var(--muted); min-height: 1.2em; }
.shot { display: none; gap: 8px; } .shot.show { display: grid; } .shot img { max-width: 100%; border-radius: 10px; border: 1px solid var(--line); }
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Nunito+Sans:wght@400;700;800&family=JetBrains+Mono&display=swap">
<div class="wrap">
  <header><h1>Neptune Filter</h1><div class="meta" id="meta">Sample picture loaded</div></header>
  <div class="stage" id="stage"><canvas id="cv"></canvas><span class="badge" id="badge">After</span></div>
  <div class="dock">
    <div class="row"><span class="lab">Picture</span>
      <label class="filebtn">Upload image<input type="file" id="file" accept="image/*"></label>
      <button id="cmp">Hold to see before</button>
      <button id="reset">Reset sliders</button>
    </div>
    <div class="sliders" id="sliders"></div>
    <div class="row"><span class="lab">Save</span><button class="primary" id="png">Download PNG</button></div>
    <div class="status" id="status"></div>
    <div class="shot" id="shot"><img id="shotImg" alt="Filtered picture"><div class="status">Downloads are off in this view - press and hold the picture to save it.</div></div>
  </div>
</div>
<script>
const SL = [
  ["shade", "Dynamic shading", 0, 2, 0.05, 1.0], ["cav", "Dark gaps (crevices)", 0, 3, 0.05, 1.4], ["bands", "Shading steps", 2, 8, 1, 5],
  ["cel", "Step hardness", 0, 1, 0.05, 0.55], ["spec", "Highlights", 0, 1.5, 0.05, 0.85], ["sat", "Colour punch", 0, 1, 0.05, 0.35],
  ["ink", "Inner ink lines", 0, 2, 0.05, 1.0], ["out", "Outline (px)", 0, 6, 1, 2]];
const val = {}; const box = document.getElementById("sliders");
SL.forEach(([k, n, mn, mx, st, df]) => { val[k] = df; const d = document.createElement("div"); d.className = "sl";
  d.innerHTML = `<label for="s_${k}">${n}</label><output id="o_${k}">${df}</output><input type="range" id="s_${k}" min="${mn}" max="${mx}" step="${st}" value="${df}">`; box.appendChild(d);
  d.querySelector("input").oninput = (e) => { val[k] = +e.target.value; document.getElementById("o_" + k).textContent = e.target.value; schedule(); }; });
document.getElementById("reset").onclick = () => SL.forEach(([k, , , , , df]) => { val[k] = df; document.getElementById("s_" + k).value = df; document.getElementById("o_" + k).textContent = df; schedule(); });
const cv = document.getElementById("cv"), ctx = cv.getContext("2d", { willReadFrequently: true }), status = document.getElementById("status");
let src = null, W = 0, H = 0, out = null, name = "picture", busy = false, again = false, showBefore = false;
function boxBlur(a, w, h, r) { if (r < 1) return a.slice(); const t = new Float32Array(a.length), o = new Float32Array(a.length), n = 2 * r + 1;
  for (let y = 0; y < h; y++) { let s = 0; const row = y * w; for (let x = -r; x <= r; x++) s += a[row + Math.min(w - 1, Math.max(0, x))];
    for (let x = 0; x < w; x++) { t[row + x] = s / n; s += a[row + Math.min(w - 1, x + r + 1)] - a[row + Math.max(0, x - r)]; } }
  for (let x = 0; x < w; x++) { let s = 0; for (let y = -r; y <= r; y++) s += t[Math.min(h - 1, Math.max(0, y)) * w + x];
    for (let y = 0; y < h; y++) { o[y * w + x] = s / n; s += t[Math.min(h - 1, y + r + 1) * w + x] - t[Math.max(0, y - r) * w + x]; } }
  return o; }
function gauss(a, w, h, sigma) { const r = Math.max(1, Math.round(sigma * 0.9)); return boxBlur(boxBlur(boxBlur(a, w, h, r), w, h, r), w, h, r); }
function filter() {
  const d = src.data, n = W * H, L = new Float32Array(n), A = new Float32Array(n), sc = Math.max(W, H) / 1000;
  for (let i = 0; i < n; i++) { L[i] = Math.max(d[i * 4], d[i * 4 + 1], d[i * 4 + 2]) / 255; A[i] = d[i * 4 + 3] / 255; }
  const b1 = gauss(L, W, H, 3 * sc), b2 = gauss(L, W, H, 14 * sc), L2 = new Float32Array(n);
  for (let i = 0; i < n; i++) { let v = L[i] + val.shade * (0.9 * (L[i] - b2[i]) + 0.5 * (L[i] - b1[i])); v -= val.cav * Math.max(0, b1[i] - L[i]); L2[i] = Math.min(1, Math.max(0, v)); }
  const bands = val.bands, L3 = new Float32Array(n);
  for (let i = 0; i < n; i++) { const q = L2[i] * (bands - 1), fl = Math.floor(q), fr = q - fl, st = (fl + Math.min(1, Math.max(0, (fr - 0.5) * 3.5 + 0.5))) / (bands - 1); L3[i] = val.cel * st + (1 - val.cel) * L2[i]; }
  const peak = new Float32Array(n);
  for (let y = 1; y < H - 1; y++) for (let x = 1; x < W - 1; x++) { const i = y * W + x, v = L2[i]; if (v <= 0.78) continue; let m = 0;
    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) m = Math.max(m, L2[i + dy * W + dx]); if (v >= m - 0.04) peak[i] = 1; }
  const spec = gauss(peak, W, H, 0.8 * Math.max(1, sc)), Ls = gauss(L, W, H, 0.8 * Math.max(1, sc)), ink = new Float32Array(n);
  for (let y = 1; y < H - 1; y++) for (let x = 1; x < W - 1; x++) { const i = y * W + x;
    const gx = (Ls[i - W + 1] + 2 * Ls[i + 1] + Ls[i + W + 1]) - (Ls[i - W - 1] + 2 * Ls[i - 1] + Ls[i + W - 1]), gy = (Ls[i + W - 1] + 2 * Ls[i + W] + Ls[i + W + 1]) - (Ls[i - W - 1] + 2 * Ls[i - W] + Ls[i - W + 1]);
    ink[i] = Math.min(1, Math.max(0, (Math.hypot(gx, gy) - 0.55) / 0.6)) * val.ink / 1.6; }
  let mask = new Uint8Array(n); for (let i = 0; i < n; i++) mask[i] = A[i] > 0.5 ? 1 : 0; const solid = mask.slice();
  for (let k = 0; k < Math.round(val.out * Math.max(1, sc)); k++) { const m2 = mask.slice(); for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) { const i = y * W + x; if (mask[i]) continue; if ((x > 0 && mask[i - 1]) || (x < W - 1 && mask[i + 1]) || (y > 0 && mask[i - W]) || (y < H - 1 && mask[i + W])) m2[i] = 1; } mask = m2; }
  const o = new ImageData(W, H), od = o.data, INK = [18, 15, 23];
  for (let i = 0; i < n; i++) { const p = i * 4;
    if (mask[i] && !solid[i]) { od[p] = INK[0]; od[p + 1] = INK[1]; od[p + 2] = INK[2]; od[p + 3] = 255; continue; }
    let r = d[p] / 255, g = d[p + 1] / 255, b = d[p + 2] / 255; const s = L[i] > 0.04 ? Math.min(3, L3[i] / L[i]) : 1;
    if (L[i] > 0.04) { r *= s; g *= s; b *= s; } else { r = g = b = L3[i]; }
    const gr = (r + g + b) / 3, k = 1 + val.sat; r = gr + (r - gr) * k; g = gr + (g - gr) * k; b = gr + (b - gr) * k;
    const sp = Math.min(1, spec[i] * val.spec) * 0.85; r = r * (1 - sp) + sp; g = g * (1 - sp) + sp; b = b * (1 - sp) + sp;
    const ik = ink[i] * 0.8; r = r * (1 - ik) + INK[0] / 255 * ik; g = g * (1 - ik) + INK[1] / 255 * ik; b = b * (1 - ik) + INK[2] / 255 * ik;
    od[p] = Math.round(Math.min(1, Math.max(0, r)) * 255); od[p + 1] = Math.round(Math.min(1, Math.max(0, g)) * 255); od[p + 2] = Math.round(Math.min(1, Math.max(0, b)) * 255); od[p + 3] = d[p + 3]; }
  return o; }
function schedule() { if (!src) return; if (busy) { again = true; return; } busy = true; status.textContent = "Working…";
  setTimeout(() => { const t = performance.now(); out = filter(); draw(); busy = false; status.textContent = "Done in " + Math.round(performance.now() - t) + " ms."; if (again) { again = false; schedule(); } }, 15); }
function draw() { if (!src) return; ctx.putImageData(showBefore ? src : (out || src), 0, 0); document.getElementById("badge").textContent = showBefore ? "Before" : "After"; }
function loadImage(img, nm) { const MAX = 1600, k = Math.min(1, MAX / Math.max(img.naturalWidth, img.naturalHeight)); W = Math.round(img.naturalWidth * k); H = Math.round(img.naturalHeight * k);
  cv.width = W; cv.height = H; ctx.clearRect(0, 0, W, H); ctx.drawImage(img, 0, 0, W, H); src = ctx.getImageData(0, 0, W, H); name = nm;
  document.getElementById("meta").textContent = nm + " · " + W + "×" + H + (k < 1 ? " (shrunk to fit 1600px)" : ""); out = null; schedule(); }
function openFile(f) { if (!f || !/^image\//.test(f.type)) { status.textContent = "That file isn't a picture - try a PNG, JPG or WebP."; return; } const u = URL.createObjectURL(f), img = new Image();
  img.onload = () => loadImage(img, f.name.replace(/\.[^.]+$/, "")); img.onerror = () => { status.textContent = "Couldn't open that picture."; }; img.src = u; }
document.getElementById("file").onchange = (e) => { openFile(e.target.files[0]); e.target.value = ""; };
const stage = document.getElementById("stage");
stage.addEventListener("dragover", (e) => { e.preventDefault(); stage.classList.add("over"); }); stage.addEventListener("dragleave", () => stage.classList.remove("over"));
stage.addEventListener("drop", (e) => { e.preventDefault(); stage.classList.remove("over"); openFile(e.dataTransfer.files[0]); });
const cmp = document.getElementById("cmp"); const on = (v) => (e) => { e.preventDefault(); showBefore = v; cmp.classList.toggle("on", v); draw(); };
cmp.addEventListener("pointerdown", on(true)); ["pointerup", "pointerleave", "pointercancel"].forEach((t) => cmp.addEventListener(t, on(false)));
document.getElementById("png").onclick = async () => { if (!out) return; const c = document.createElement("canvas"); c.width = W; c.height = H; c.getContext("2d").putImageData(out, 0, 0);
  const blob = await new Promise((r) => c.toBlob(r, "image/png")), fn = name.replace(/[^\w-]+/g, "_") + "_neptune.png";
  let dl = null; try { dl = window.claude && (await window.claude.use("downloads")); } catch (e) {}
  if (dl) { try { await dl.save({ filename: fn, data: blob }); status.textContent = "Saved " + fn + "."; return; } catch (e) { if (e && e.code === "declined") { status.textContent = "Download cancelled."; return; } } }
