<title>Wake Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Nunito+Sans:wght@400;700;800&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: the sea (live ship + wake) on top, a dock of grouped sliders under it; one column on phones, sliders in two columns when wide. Single dark look on purpose: it matches the game (navy + gold, flat cyan buttons). */
:root {
  --bg: #0b1424; --panel: #13203a; --panel2: #0f1a2f; --ink: #eef3fb; --muted: #8fa3c2; --line: #2a3d63;
  --gold: #f0c95f; --cyan: #3fc6e0; --cyan-ink: #062430; --sea: #316f96;
  --display: "Cinzel", Georgia, serif; --body: "Nunito Sans", system-ui, sans-serif; --mono: "JetBrains Mono", ui-monospace, monospace;
  color-scheme: dark;
}
html, body { background: var(--bg); color: var(--ink); font-family: var(--body); }
.wrap { padding-block: 14px 28px; padding-inline: 16px; max-width: 980px; margin: 0 auto; display: grid; gap: 12px; }
header { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
h1 { font-family: var(--display); font-size: 22px; margin: 0; letter-spacing: .05em; color: var(--gold); }
.meta { font-family: var(--mono); font-size: 11.5px; color: var(--muted); }
.stage { position: relative; aspect-ratio: 4 / 3; max-width: 100%; border: 1.5px dashed var(--line); border-radius: 14px; overflow: hidden; background: var(--sea); touch-action: none; }
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.dock { display: grid; gap: 12px; background: var(--panel); border: 1px dotted var(--line); border-radius: 14px; padding: 12px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.lab { font-size: 11px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--gold); width: 100%; }
button { font: 700 14px var(--body); padding: 8px 13px; border-radius: 9px; border: 1.5px solid var(--line); background: var(--panel2); color: var(--ink); cursor: pointer; }
button.on, button.primary { background: var(--cyan); color: var(--cyan-ink); border-color: var(--cyan); }
button:focus-visible, input:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.groups { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
.group { display: grid; gap: 8px; background: var(--panel2); border-radius: 11px; padding: 10px 12px; min-width: 0; }
.sl { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; align-items: center; }
.sl label { font-size: 13px; color: var(--ink); }
.sl output { font-family: var(--mono); font-size: 12px; color: var(--cyan); font-variant-numeric: tabular-nums; }
.sl input { grid-column: 1 / -1; width: 100%; accent-color: var(--cyan); }
textarea { width: 100%; box-sizing: border-box; min-height: 86px; font: 12px/1.4 var(--mono); color: var(--ink); background: var(--panel2); border: 1px solid var(--line); border-radius: 9px; padding: 8px; resize: vertical; }
.note { font-size: 12.5px; color: var(--muted); }
@media (prefers-reduced-motion: reduce) { .note.rm { color: var(--gold); } }
</style>

<div class="wrap">
  <header>
    <h1>Wake Lab</h1>
    <span class="meta" id="meta">Ghost Galleon · game ship code · 1 tile = <span id="metaU">64</span> px</span>
  </header>

  <div class="stage" id="stage">
    <canvas id="sea"></canvas>
    <canvas id="ship"></canvas>
    <canvas id="front"></canvas>
  </div>

  <div class="dock">
    <div class="row">
      <span class="lab">Ship</span>
      <button id="s_pirate" class="on" data-ship="pirate">Ghost Galleon</button>
      <button id="s_void" data-ship="void">Voidspire</button>
    </div>
    <div class="row">
      <span class="lab">What it's doing</span>
      <button id="m_loop" class="on" data-mode="loop">Sailing a loop</button>
      <button id="m_straight" data-mode="straight">Sailing straight</button>
      <button id="m_parked" data-mode="parked">Parked (fighting)</button>
      <button id="pause">Pause</button>
    </div>
    <div class="groups" id="groups"></div>
    <div class="row">
      <span class="lab">Send me your settings</span>
      <button class="primary" id="copy">Copy settings</button>
      <button id="reset">Reset to defaults</button>
    </div>
    <textarea id="out" readonly aria-label="Settings to send"></textarea>
    <p class="note">Tap Copy settings and paste them to me in chat; I'll put those exact numbers into the game.</p>
  </div>
</div>
