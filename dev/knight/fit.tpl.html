<meta charset="utf-8">
<title>Knight Sword Fitting</title>
<style>
/* Layout: a hero-screen-shaped stage with the animated knight (the thing being judged), a slim control row under it. Single dark look like the game (navy + gold, bronze frame). */
:root { --night: #070b14; --panel: #101a2e; --line: #26385c; --ink: #eef3fb; --muted: #93a2bd; --gold: #f0c95f; --cyan: #3fc6e0; --bronze: #8a6a3a; color-scheme: dark; }
[hidden] { display: none !important; }
html, body { background: var(--night); color: var(--ink); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
.wrap { max-width: 760px; margin: 0 auto; padding-block: 14px 26px; padding-inline: 16px; display: grid; gap: 12px; }
h1 { margin: 0; font: 700 20px Georgia, serif; color: var(--gold); }
.sub { color: var(--muted); font-size: 13px; }
.stage { position: relative; height: min(66vh, 560px); min-height: 360px; border-radius: 14px; overflow: hidden; border: 2px solid var(--bronze); background: radial-gradient(60% 55% at 50% 45%, #2a3e66 0%, #121c33 60%, #070b14 100%); touch-action: none; cursor: grab; }
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.plate { position: absolute; left: 50%; bottom: 7%; width: 46%; aspect-ratio: 3 / 1; transform: translateX(-50%); border-radius: 50%; background: radial-gradient(closest-side, rgba(240,201,95,.28), rgba(240,201,95,.08) 60%, rgba(0,0,0,0)); pointer-events: none; }
.name { position: absolute; left: 14px; top: 12px; font: 700 18px Georgia, serif; color: var(--gold); text-shadow: 0 2px 6px rgba(0,0,0,.6); pointer-events: none; }
.name small { display: block; font: 700 11px system-ui, sans-serif; color: var(--muted); letter-spacing: .06em; }
.ctl { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; font-size: 13px; color: var(--muted); font-weight: 700; }
.ctl select { background: var(--night); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 5px 8px; font: 700 13px system-ui, sans-serif; }
.ctl input[type=range] { width: 110px; accent-color: var(--cyan); }
.ctl label { display: flex; align-items: center; gap: 6px; }
.ctl select:focus-visible, .ctl input:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.err { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); padding: 20px; text-align: center; }
</style>
<div class="wrap">
  <header><h1>Knight Sword Fitting</h1><div class="sub">The sword is cut from Harley's sword-holding knight and fixed to the rigged knight's right-hand bone, so it follows every animation without bending · use the grip sliders to seat it in the fist</div></header>
  <div class="stage" id="stage"><div class="plate"></div><canvas id="cv" aria-label="Animated knight"></canvas><div class="name">Knight<small>HERO PREVIEW</small></div><div class="err" id="err" hidden>WebGL is switched off in this browser.</div></div>
  <div class="ctl">
    <label for="anim">Animation <select id="anim"></select></label>
    <label for="speed">Speed <input type="range" id="speed" min="0.2" max="1.5" step="0.05" value="1"></label>
    <label for="look">Look <select id="look"><option value="cel">Cel shaded</option><option value="smooth">Smooth</option></select></label>
    <label for="outline">Outline <select id="outline"><option value="1">On</option><option value="0">Off</option></select></label>
    <label for="spin">Turn <select id="spin"><option value="2" selected>Game side view</option><option value="0">Hold angle</option><option value="1">Slow spin</option></select></label>
  </div>
  <div class="ctl" id="grip">
    <b style="color:var(--gold)">Grip</b>
    <label for="rx">Tilt <input type="range" id="rx" min="-180" max="180" step="1"></label>
    <label for="ry">Twist <input type="range" id="ry" min="-180" max="180" step="1"></label>
    <label for="rz">Lean <input type="range" id="rz" min="-180" max="180" step="1"></label>
    <label for="ox">Move X <input type="range" id="ox" min="-0.25" max="0.25" step="0.005"></label>
    <label for="oy">Move Y <input type="range" id="oy" min="-0.25" max="0.25" step="0.005"></label>
    <label for="oz">Move Z <input type="range" id="oz" min="-0.25" max="0.25" step="0.005"></label>
    <label for="ss">Size <input type="range" id="ss" min="0.5" max="1.5" step="0.01"></label>
    <span id="gripV" style="font:12px ui-monospace,Menlo,monospace;color:var(--ink)"></span>
  </div>
</div>
